# ==============================================================================
# FINANCIAL ASSUMPTIONS - COGS & GROSS MARGIN BENCHMARKS (BRL / R$)
# ==============================================================================
# DISCLAIMER: ASSUMPTION, NOT REAL DATA.
# The public Olist Brazilian E-Commerce dataset does not provide item-level cost
# or COGS (Cost of Goods Sold). All financial values (price, freight, payments)
# in Olist are natively in Brazilian Reais (R$ / BRL).
#
# To enable unit economics, gross profit, and profitability analytics in BRL (R$),
# the 70+ product categories are mapped into 11 macro sectors with realistic
# industry benchmark margins (derived from retail and marketplace e-commerce standards).
#
# Market Commission / Take Rate: 10% marketplace revenue fee
# Currency: Brazilian Reais (R$ / BRL)
# ==============================================================================

metadata:
  model_name: "E-Commerce Category Profitability Benchmark Model"
  version: "1.1"
  status: "ASSUMPTION - NOT REAL DATA"
  currency: "BRL"
  currency_symbol: "R$"
  default_marketplace_commission_rate: 0.10  # 10% platform take-rate

category_groups:
  Computers & Electronics:
    cogs_rate: 0.75          # 75% COGS
    gross_margin_rate: 0.25  # 25% Gross Margin
    description: "High-ticket hardware, consumer electronics, and computing gear."
